/* FONTS */
:root{font-family:Geist,"PingFang SC","Microsoft YaHei",sans-serif;color:#24251f;background:#f7f6f2;font-synthesis:none}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;--ink:#252621;--sub:#63645a;--paper:#f9f8f5;--panel:#fcfbf8;--line:#e4e1d9;--desk:#eeece6;--hover:#eeece5;--accent:#be4126;--accent-soft:#f7e7df;color:var(--ink);background:var(--paper)}

.top-actions,.group{gap:5px}

.icon{width:33px;height:33px;padding:7px}

.thumbnail svg{width:14px;height:14px}

.segment{display:flex;padding:2px;gap:2px;background:var(--desk);border:1px solid var(--line);border-radius:8px}
.segment button{height:26px;padding:0 7px;color:var(--sub);font-size:11px}

.quiet{font-size:11px;line-height:1.6;color:var(--sub);margin:6px 0 14px}

.field{display:grid;gap:6px;margin:0 0 11px;font-size:11px;color:var(--sub)}
.field input,.field textarea,.field select{background:var(--paper);border:1px solid var(--line);border-radius:6px;width:100%;padding:7px 8px;font-size:12px;color:var(--ink)}
.field textarea{min-height:64px;resize:vertical}
.field input[type=color]{height:34px;padding:3px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.panel-btn{border-color:var(--line);width:100%;justify-content:center}
.panel-btn + .panel-btn{margin-top:7px}
.danger{color:var(--accent)}
.status{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:#272620;color:#fff;padding:9px 13px;border-radius:8px;z-index:99;font-size:12px;box-shadow:0 5px 15px #20160d32;pointer-events:none}
.status:empty{display:none}
.portrait-cover{background-size:cover}

@media(max-width:850px){.shell{grid-template-columns:minmax(0,1fr) 215px}.left{grid-column:1/-1;display:flex;align-items:center;gap:10px;border-right:0;border-bottom:1px solid var(--line);padding:7px 13px}.left .rail-title{margin:0;white-space:nowrap}.list{display:flex;overflow:auto;flex:1;gap:3px}.list .row{max-width:144px;flex:0 0 auto;margin:0}.row-select{min-height:34px;padding:3px 5px}.row-dot,.rail-note{display:none}.desk{min-height:530px}}
@media(max-width:600px){.top{height:55px;padding:0 11px;gap:6px}.brand b{font-size:17px}.project{padding-left:0;gap:0;font-size:0;flex:1}.project:before,.repo-link span{display:none}.app-version{font-size:10px}.repo-link{margin:0;padding:5px}.top-actions{gap:0}.top .plain{padding:4px 5px}.action{margin-left:2px}.shell{display:flex;flex-direction:column}.left{padding:5px 8px;gap:5px}.left h2{display:none}.right{border:0;border-top:1px solid var(--line);padding:13px 15px 90px}.canvas-bar{height:42px;padding:0 8px}.canvas-heading{gap:5px}.desk{min-height:350px;padding:19px 12px 80px}.toolbar{bottom:14px}.canvas-meta{top:calc(100% + 6px);font-size:10px}.presets{grid-template-columns:repeat(4,minmax(0,1fr))}}



.left{position:relative;z-index:9}
.card-count{margin-left:5px;color:var(--sub);font-size:11px;font-weight:550;font-variant-numeric:tabular-nums}

.add-card{background:var(--paper);color:var(--accent)}
.add-menu{position:absolute;top:calc(100% + 6px);left:0;width:max(100%,154px);padding:5px;background:var(--panel);border:1px solid var(--line);border-radius:9px;z-index:8;box-shadow:0 10px 24px #27231222}

.bar-label{font-size:12px;font-weight:700;white-space:nowrap}

.template-tabs button:hover{background:var(--hover)}
.template-tabs button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.template-tabs button:focus-visible{outline-offset:-2px}
.segment{flex:none}
.segment svg{display:none}
.collage-tile canvas{filter:drop-shadow(3px 4px 5px #28181130)}

@media(max-width:600px){.bar-label{display:none}.template-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px}.template-tabs button{font-size:11px;padding:5px 2px}.canvas-bar{height:58px;gap:6px}.segment button{padding:0 5px}.add-card svg{width:14px;height:14px}
#stage[data-ratio=phone] .desk{min-height:min(650px,calc(100dvh - 65px))}.right{padding-bottom:32px}.status{bottom:20px}}
.photo-action{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:650}
.photo-action:hover{background:color-mix(in srgb,var(--accent-soft) 74%,var(--line))}
.crop-launch{position:absolute;z-index:50;height:29px;padding:0 6px;display:flex;align-items:center;justify-content:center;gap:4px;color:#fff;border:1px solid #ffffff55;background:#191b19db;border-radius:6px;box-shadow:0 1px 5px #0003;font-size:11px;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.crop-launch:hover{background:#1c211e}
.crop-launch svg{width:15px;height:15px}
.image-crop{width:min(728px,calc(100% - 28px));max-height:calc(100dvh - 28px);padding:0;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:15px;box-shadow:0 20px 70px #16171138;overscroll-behavior:contain}
.image-crop[open]{display:block}
.image-crop::backdrop{background:#17171170}
.crop-header,.crop-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 16px}
.crop-header h2{font-size:16px;font-weight:720;margin:0}
.crop-header .icon{margin-right:-3px}
.crop-stage{position:relative;height:clamp(202px,54dvh,465px);margin:0 13px;overflow:hidden;background:#222521;border-radius:9px;isolation:isolate}
.crop-stage img,.crop-preview,.crop-frame{position:absolute}
.crop-stage img{max-width:none;user-select:none;pointer-events:none}
.crop-ghost{opacity:.34}
.crop-preview{overflow:hidden;pointer-events:none}
.crop-frame{cursor:grab;touch-action:none;outline:1px solid #fff;box-shadow:0 0 0 2px #0005}
.crop-frame:focus-visible{outline:2px solid #fff;outline-offset:3px}
.crop-stage[data-gesture=pan] .crop-frame{cursor:grabbing}
.crop-grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(to right,#fff7 1px,transparent 1px),linear-gradient(to bottom,#fff7 1px,transparent 1px);background-position:0 0;background-size:33.333% 33.333%}
.crop-handle{position:absolute;display:block;width:34px;height:34px;padding:0;background:transparent;border:0;z-index:2;touch-action:none;-webkit-tap-highlight-color:transparent}
.crop-handle::after{content:"";position:absolute;left:14px;top:14px;width:16px;height:16px;border-left:3px solid #fff;border-top:3px solid #fff;filter:drop-shadow(0 1px 1px #16171399)}
.crop-handle:focus-visible{outline-color:#fff}
.crop-handle[data-corner=nw]{left:-17px;top:-17px;cursor:nwse-resize}

.crop-handle[data-corner=sw]{left:-17px;bottom:-17px;cursor:nesw-resize;transform:rotate(270deg)}
#crop-hint{margin:10px 16px 9px;font-size:12px;color:var(--sub)}
.crop-controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:2px 16px 14px}

.crop-modes button:hover{background:var(--hover)}
.crop-modes button[aria-pressed=true]{color:var(--accent);background:var(--accent-soft);font-weight:680}

.crop-zoom .icon{font-size:17px;width:34px;height:33px}

.crop-reset,.crop-center{color:var(--sub)}

<body>
<div id="stage"></div>
<div class="status" role="status"></div>
<dialog class="image-crop" aria-labelledby="crop-title">
  <div class="crop-header">
    <h2 id="crop-title">裁剪图片</h2>
    <button type="button" class="icon" data-crop="cancel" aria-label="关闭裁剪">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="crop-stage">
    <img class="crop-ghost" alt="" draggable="false">
    <div class="crop-preview"><img alt="" draggable="false"></div>
    <div class="crop-frame" role="group" aria-label="图片取景" aria-describedby="crop-hint" tabindex="0">
      <span class="crop-grid" aria-hidden="true"></span>
      <button type="button" class="crop-handle" data-corner="nw" aria-label="裁剪左上角"></button>
      <button type="button" class="crop-handle" data-corner="ne" aria-label="裁剪右上角"></button>
      <button type="button" class="crop-handle" data-corner="sw" aria-label="裁剪左下角"></button>
      <button type="button" class="crop-handle" data-corner="se" aria-label="裁剪右下角"></button>
    </div>
  </div>
  <p id="crop-hint">拖动图片调整取景，拖四角裁边。</p>
  <div class="crop-controls">
    <div class="crop-modes" role="group" aria-label="图片显示方式">
      <button type="button" data-crop="cover" aria-pressed="true" title="铺满卡片，超出的部分裁掉">填满卡片</button>
      <button type="button" data-crop="contain" aria-pressed="false" title="保留原图四边，按比例缩放">完整显示</button>
    </div>
    <div class="crop-zoom" role="group" aria-label="图片缩放">
      <button type="button" class="icon" data-crop="minus" aria-label="缩小图片" title="缩小图片">−</button>
      <output class="crop-zoom-value">100%</output>
      <button type="button" class="icon" data-crop="plus" aria-label="放大图片" title="放大图片">＋</button>
    </div>
    <button type="button" class="plain crop-center" data-crop="center">居中</button>
  </div>
  <div class="crop-footer">
    <button type="button" class="plain crop-reset" data-crop="reset">恢复默认</button>
    <div class="group">
      <button type="button" class="plain" data-crop="cancel">取消</button>
      <button type="button" class="action" data-crop="apply">应用裁剪</button>
    </div>
  </div>
</dialog>
<dialog class="examples-dialog" aria-labelledby="examples-title">
  <div class="examples-header">
    <h2 id="examples-title">样例</h2>
    <div class="group">
      <button type="button" class="plain examples-own" data-example="mine">我的稿件</button>
      <button type="button" class="icon" data-close-examples aria-label="关闭样例" autofocus>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>
  </div>
  <div class="examples-grid"></div>
</dialog>
<script>/* APP */</script>
</body>
</html>
